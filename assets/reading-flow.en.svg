<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">Reading Companion conditional workflow</title>
  <desc id="desc">Start with goal, scope and mode; check the source or current session state; route to the needed task; apply relevant gates; return results with limits and truthful state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#142b43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#68e0c1"/>
      <stop offset="1" stop-color="#7bb8ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#75a0c1"/>
    </marker>
  </defs>
  <rect width="1200" height="450" rx="24" fill="url(#bg)"/>
  <circle cx="1120" cy="10" r="170" fill="#24456a" opacity=".2"/>
  <circle cx="40" cy="425" r="150" fill="#1c796d" opacity=".13"/>
  <text x="48" y="49" fill="#80e2ca" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">READING COMPANION  /  CONDITIONAL WORKFLOW</text>
  <text x="48" y="82" fill="#f4f8fc" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Choose the needed route; keep sources and state clear</text>
  <g fill="none" stroke="#75a0c1" stroke-width="2" marker-end="url(#arrow)">
    <path d="M270 184H314"/>
    <path d="M565 184H610"/>
    <path d="M885 237V292H710V316"/>
    <path d="M825 357H885"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(42 118)">
      <rect width="228" height="132" rx="17" fill="#1a3048" stroke="#31516e"/>
      <circle cx="29" cy="29" r="16" fill="#1d5e5a"/>
      <text x="29" y="34" text-anchor="middle" fill="#a8f2df" font-size="13" font-weight="700">01</text>
      <text x="20" y="68" fill="#f4f8fc" font-size="17" font-weight="700">Frame the task</text>
      <text x="20" y="94" fill="#b8c8d8" font-size="13">Goal · scope · mode</text>
      <text x="20" y="114" fill="#b8c8d8" font-size="13">Source and choices</text>
    </g>
    <g transform="translate(315 118)">
      <rect width="250" height="132" rx="17" fill="#1a3048" stroke="#31516e"/>
      <circle cx="29" cy="29" r="16" fill="#3b4a78"/>
      <text x="29" y="34" text-anchor="middle" fill="#c7d2ff" font-size="13" font-weight="700">02</text>
      <text x="20" y="68" fill="#f4f8fc" font-size="17" font-weight="700">Check the input</text>
      <text x="20" y="94" fill="#b8c8d8" font-size="13">Source · revision · locator</text>
      <text x="20" y="114" fill="#b8c8d8" font-size="13">Or existing session state</text>
    </g>
    <g transform="translate(610 105)">
      <rect width="275" height="158" rx="17" fill="#1a3048" stroke="#31516e"/>
      <circle cx="29" cy="29" r="16" fill="#69522b"/>
      <text x="29" y="34" text-anchor="middle" fill="#ffe2a2" font-size="13" font-weight="700">03</text>
      <text x="20" y="67" fill="#f4f8fc" font-size="17" font-weight="700">Route by task</text>
      <text x="20" y="94" fill="#b8c8d8" font-size="13">Deep · Extract · Combined</text>
      <text x="20" y="116" fill="#b8c8d8" font-size="13">Compare · Map · Example</text>
      <text x="20" y="138" fill="#b8c8d8" font-size="13">Answer · Session · Handoff</text>
    </g>
    <g transform="translate(485 316)">
      <rect width="340" height="82" rx="17" fill="#1a3048" stroke="#31516e"/>
      <circle cx="29" cy="29" r="16" fill="#623d51"/>
      <text x="29" y="34" text-anchor="middle" fill="#ffc5d5" font-size="13" font-weight="700">04</text>
      <text x="55" y="32" fill="#f4f8fc" font-size="16" font-weight="700">Apply relevant gates</text>
      <text x="20" y="61" fill="#b8c8d8" font-size="13">Source · meaning · selection · example · Q · state</text>
    </g>
    <g transform="translate(885 316)">
      <rect width="273" height="82" rx="17" fill="#1a3048" stroke="#31516e"/>
      <circle cx="29" cy="29" r="16" fill="#1d5e5a"/>
      <text x="29" y="34" text-anchor="middle" fill="#a8f2df" font-size="13" font-weight="700">05</text>
      <text x="55" y="32" fill="#f4f8fc" font-size="16" font-weight="700">Return the result</text>
      <text x="20" y="61" fill="#b8c8d8" font-size="13">Sources · limits · real state</text>
    </g>
  </g>
  <rect x="42" y="408" width="1116" height="2" rx="1" fill="url(#accent)" opacity=".8"/>
  <text x="48" y="431" fill="#9fb5c9" font-family="Segoe UI,Arial,sans-serif" font-size="12">Routes are selected for the request; this is not a mandatory pipeline for every turn.</text>
</svg>
