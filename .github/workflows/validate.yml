name: Validate Plugin & Contracts

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Validate Plugin JSON Schemas
      run: |
        python -m json.tool plugin.json > /dev/null
        python -m json.tool .codex-plugin/plugin.json > /dev/null

    - name: Validate repository structure and documentation links
      run: python tools/validate_repository.py

    - name: Install test dependencies
      run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7"

    - name: Validate citation evidence records
      run: |
        python tools/validate_citation_evidence.py
        python tools/validate_luna_rerun.py
        python tools/validate_gate_records.py evaluation/citeguard/sync-0.3.7/sidecar.json --root evaluation/citeguard/sync-0.3.7 --expected-artifact artifact.md=1
        python tools/validate_sync_evidence.py --root . --require-current-context

    - name: Run helper and evidence regression tests
      run: python -m pytest -q

    - name: Compile helper scripts
      run: python -m compileall -q tools skills/sid-reading-companion/scripts

    - name: Check helper CLI interfaces
      run: |
        python skills/sid-reading-companion/scripts/ia_map.py --help
        python skills/sid-reading-companion/scripts/knowledge_compiler.py --help
        python skills/sid-reading-companion/scripts/checkpoint.py --help
        python skills/sid-reading-companion/scripts/reading_session.py --help

    - name: Build and verify runtime package from source
      run: |
        python tools/build_plugin.py --root . --output "$RUNNER_TEMP/reading-companion.zip" --source-commit "$GITHUB_SHA"
        python tools/verify_plugin_package.py "$RUNNER_TEMP/reading-companion.zip" --manifest "$RUNNER_TEMP/reading-companion.manifest.json"

